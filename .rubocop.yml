plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  SuggestExtensions: false

# dummy_controller_spec.rb doubles as the shared-examples exercise spec.
RSpec/SpecFilePathFormat:
  Exclude:
    - spec/dummy_controller_spec.rb

RSpec/SpecFilePathSuffix:
  Exclude:
    - spec/dummy_controller_spec.rb
