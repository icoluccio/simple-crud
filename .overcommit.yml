PrePush:
  ALL:
    problem_on_unmodified_line: report
    requires_files: false
    quiet: false

  RuboCop:
    enabled: true
    command: ['bundle', 'exec', 'rubocop']

  CustomScript:
    enabled: true
    description: 'Run RSpec'
    command: ['bundle', 'exec', 'rspec']
    env:
      BUNDLE_GEMFILE: gemfiles/rails_8.1.gemfile
